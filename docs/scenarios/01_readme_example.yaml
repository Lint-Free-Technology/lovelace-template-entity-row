id: doc_readme_example
description: README example screenshot
view_path: readme-example

dashboard:
  title: template-entity-row
  views:
    - path: readme-example
      title: README Example
      cards:
        - type: entities
          title: Quick Start
          entities:
            - light.bed_light
            - type: custom:template-entity-row
              icon: mdi:lamp
              name: "The light is {{states('light.bed_light')}} but nobody's"
              state: "{% if is_state('input_boolean.car_home', 'on')%} home {% else %} away {% endif %}"
              secondary: "It's {{states('sensor.time')}}"
              active: "{{ is_state('light.bed_light', 'off') }}"

doc_image:
  output: docs/source/assets/images/01_readme_example.png
  root: hui-entities-card
  padding: 16
  threshold: 0.02
