id: entity_based_entities_on
description: Entity based options with entities on
view_path: entity-based-entities-on

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631
    settle_ms: 50
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.ceiling_lights
      brightness: 255
      color_temp_kelvin: 2631
    settle_ms: 50
  - type: ha_service
    domain: input_boolean
    service: turn_on
    data:
      entity_id: input_boolean.test_boolean
    settle_ms: 50

dashboard:
  views:
    - type: sections
      max_columns: 4
      title: Template Entity Row
      path: entity-based
      sections:
        - type: grid
          cards:
            - type: entities
              title: Entity based 1
              entities:
                - type: custom:template-entity-row
                  entity: light.bed_light
                - type: section
                  label: icon
                - type: custom:template-entity-row
                  entity: light.bed_light
                  icon: mdi:cog
                - type: custom:template-entity-row
                  entity: light.bed_light
                  icon:
                - type: custom:template-entity-row
                  entity: light.bed_light
                  active: true
                  name: Active
                - type: custom:template-entity-row
                  entity: light.bed_light
                  active: false
                  name: Inactive
                - type: custom:template-entity-row
                  entity: light.bed_light
                  name: Color
                  color_inactive: true
                  color: magenta
                - type: section
                  label: name
                - type: custom:template-entity-row
                  entity: light.bed_light
                  name: name
                - type: custom:template-entity-row
                  entity: light.bed_light
                  name:
                - type: custom:template-entity-row
                  entity: light.bed_light
                  name:
                    - type: text
                      text: "The"
                    - type: entity
                    - type: text
                      text: "is"
                - type: section
                  label: state
                - type: custom:template-entity-row
                  entity: light.bed_light
                  state: state
                - type: custom:template-entity-row
                  entity: light.bed_light
                  state:
        - type: grid
          cards:
            - type: entities
              title: Entity based 2
              entities:        
                - type: section
                  label: secondary
                - type: custom:template-entity-row
                  entity: light.bed_light
                  secondary: secondary
                - type: custom:template-entity-row
                  entity: light.bed_light
                  secondary:
                    - name
                    - state
                    - brightness
                - type: custom:template-entity-row
                  entity: light.bed_light
                  secondary_entity: light.ceiling_lights
                  secondary_name: |
                    [
                      { "type": "entity" },
                      { 
                        "type": "text",
                        "text": "{{ (state_attr(config.secondary_entity, 'brightness') | float(0) / 255 * 100) | round }}%"
                      }
                    ]
                  secondary:
                    - name
                    - state
                - type: section
                  label: image
                - type: custom:template-entity-row
                  entity: light.bed_light
                  image: https://picsum.photos/id/433/50
                - type: section
                  label: condition
                - type: custom:template-entity-row
                  entity: light.bed_light
                  condition: "{{is_state('input_boolean.test_boolean', 'on')}}"
                - type: section
                  label: toggle
                - type: custom:template-entity-row
                  entity: light.bed_light
                  toggle: true
                - type: custom:template-entity-row
                  name: No Entity
                  toggle: true
                - type: custom:template-entity-row
                  name: Conditional
                  entity: light.bed_light
                  toggle: "{{is_state(config.entity, 'on')}}"

interactions:
  - type: set_viewport
    width: 1400
    height: 900

assertions:
  - type: snapshot
    name: 04_entity_based_entities_on
    threshold: 0.01
