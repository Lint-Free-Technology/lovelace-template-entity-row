id: tap_action
description: Tap/hold/double actions from reference/lovelace.yaml Test 6
view_path: tap-action

card:
  type: entities
  title: Tap action
  entities:
    - entity: input_boolean.test
    - type: custom:template-entity-row
      entity: input_boolean.test
    - type: custom:template-entity-row
      entity: input_boolean.test
      name: "{% if is_state(config.entity, 'on') %} Toggle {% else %} More info {% endif %}"
      tap_action: "{'action': '{% if is_state('input_boolean.test', 'on') %}toggle{% else %}more-info{% endif %}'}"
      hold_action:
        action: more-info
    - type: custom:template-entity-row
      entity: light.bed_light
      hold_action:
        action: more-info
      tap_action: |
        {
          "action": "toggle",
          "confirmation": {
            "text": "Do you really want to turn {{ state_attr(config.entity, 'friendly_name') }} {% if is_state(config.entity, 'on') %}off{% else %}on{% endif %}?",
          },
        }
      double_tap_action:
        action: toggle
    - type: custom:template-entity-row
      name: No entity
      entity: light.bed_light
      tap_action: { "action": "toggle" }

assertions:
  - type: snapshot
    name: 06_tap_action
    threshold: 0.02
