id: templates_entities_on
description: Template rendering with entities on
view_path: templates-entities-on

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631
    settle_ms: 50
  - type: ha_service
    domain: input_boolean
    service: turn_on
    data:
      entity_id: input_boolean.test_boolean
    settle_ms: 50
  - type: ha_service
    domain: switch
    service: turn_on
    data:
      entity_id: switch.decorative_lights
    settle_ms: 50

dashboard:
  views:
    - type: sections
      max_columns: 4
      title: Template Entity Row
      path: templates-entities-on
      sections:
        - type: grid
          cards:
            - type: entities
              title: Templates Entities On 1
              entities:
                - entity: input_boolean.test_boolean
                - type: section
                  label: icon
                - type: custom:template-entity-row
                  icon: "{% if is_state('input_boolean.test_boolean', 'on') %} mdi:cog {% else %} mdi:cog-outline {% endif %}"
                - type: section
                  label: name
                - type: custom:template-entity-row
                  name: "Name for{% if is_state('input_boolean.test_boolean', 'on') %} active {% else %} inactive {% endif %}state"
                - type: custom:template-entity-row
                  entity: light.bed_light
                  name: |
                    [
                      { "type": "entity" },
                      { "type": "text", "text": " is {{ 'active' if is_state('input_boolean.test_boolean', 'on') else 'inactive' }}" }
                    ]
                - type: section
                  label: state
                - type: custom:template-entity-row
                  state: "[{{states('input_boolean.test_boolean')}}]"
                - type: section
                  label: secondary
                - type: custom:template-entity-row
                  secondary: "{{states('input_boolean.test_boolean')}}"
                - type: section
                  label: image
                - type: custom:template-entity-row
                  image: |
                    {%- set id = '433' if is_state('input_boolean.test_boolean', 'off') else '237' -%}
                    https://picsum.photos/id/{{id}}/50
                  secondary: |
                    {%- set name = 'Bear' if is_state('input_boolean.test_boolean', 'off') else 'Dog' -%}
                    {{ name}}
        - type: grid
          cards:
            - type: entities
              title: Templates Entities On 2
              entities:
                - type: section
                  label: active
                - type: custom:template-entity-row
                  icon: mdi:cog
                  active: "{{is_state('input_boolean.test_boolean', 'on')}}"
                - type: section
                  label: condition
                - type: custom:template-entity-row
                  name: conditional
                  condition: "{{is_state('input_boolean.test_boolean', 'on')}}"
                - type: section
                  label: color
                - type: custom:template-entity-row
                  icon: mdi:cog
                  entity: switch.decorative_lights
                - type: custom:template-entity-row
                  icon: mdi:cog
                  color: "rgb{{state_attr('light.bed_light', 'rgb_color')}}"
                  active: "true"
                - type: custom:template-entity-row
                  icon: mdi:cog
                  name: Changing
                  color: "{{'teal' if is_state('input_boolean.test_boolean', 'on') else 'purple' }}"
                - type: custom:template-entity-row
                  icon: mdi:cog
                  name: Changing
                  color: "{{'purple' if is_state('input_boolean.test_boolean', 'on') else '' }}"

assertions:
  - type: snapshot
    name: 06_templates_entities_on
    threshold: 0.01
