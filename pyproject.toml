[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template-entity-row"
version = "3.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "ha-testcontainer[test]==2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
